# Mosquitto MQTT Broker Configuration — PRODUCTION
# Hesperus: Autonomous IoT Visual Monitoring
#
# Differs from mosquitto.conf (dev): requires authentication. Dev keeps
# allow_anonymous for local convenience; a real deployment on a shared,
# internet-facing host cannot — anyone could otherwise subscribe to every
# topic and publish board commands (erase_wifi, firmware_update, sleep_mode).
#
# password_file is generated at deploy time from MQTT_USERNAME/MQTT_PASSWORD
# secrets (see infra/deploy.sh) — never committed to the repo.

# ── Listeners ──────────────────────────────────────────
listener 1883
protocol mqtt

listener 9001
protocol websockets

# ── Security ───────────────────────────────────────────
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# ── Persistence ────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Logging ────────────────────────────────────────────
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
