name: Hesperus CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  #  Stage 0: Adaptive Changes Check
  # ══════════════════════════════════════════════════════════════════════════
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      firmware: ${{ steps.filter.outputs.firmware }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/**'
            dashboard:
              - 'dashboard/**'
              - '.github/workflows/**'
            firmware:
              - 'firmware/**'
              - '.github/workflows/**'

  # ══════════════════════════════════════════════════════════════════════════
  #  Stage 1: Validations & Tests
  # ══════════════════════════════════════════════════════════════════════════
  test-server:
    name: Backend Tests (Server)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.server == 'true'
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          DATABASE_URL: "sqlite+aiosqlite://"
          MQTT_BROKER_HOST: "localhost"
          MQTT_BROKER_PORT: "1883"
        run: |
          python -m pytest tests/ -v --tb=short

  lint-dashboard:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Biome Lint & Format Check
        run: npx biome check --no-errors-on-unmatched --diagnostic-level=error

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Next.js Production Build
        run: npm run build

  # ══════════════════════════════════════════════════════════════════════════
  #  Stage 1.5: Build & Upload Firmware
  # ══════════════════════════════════════════════════════════════════════════
  build-firmware:
    name: Build & Upload Firmware
    runs-on: ubuntu-latest
    # Needs deploy-vps, not just changes: the "Upload Firmware to Server" step
    # POSTs to DEPLOY_SERVER_URL, which only exists once the server container
    # is actually up. Found the hard way — this job used to run in parallel
    # with build-server/deploy-vps and got connection-refused on a fresh
    # deploy where the server had never been started before.
    #
    # deploy-vps only RUNS when server/dashboard changed — a firmware-only
    # push skips it, and by default a job needing a skipped job also skips.
    # always() + checking .result explicitly avoids that: proceed unless
    # deploy-vps actually failed. When deploy-vps is skipped, the server is
    # presumably already up from a prior deploy (steady state), so the
    # upload is still safe to attempt.
    needs: [changes, deploy-vps]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.firmware == 'true' &&
      needs.deploy-vps.result != 'failure' &&
      needs.deploy-vps.result != 'cancelled'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ARM GCC Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make

      - name: Build Firmware
        working-directory: firmware
        env:
          MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
          MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
          FIRMWARE_UPLOAD_TOKEN: ${{ secrets.FIRMWARE_UPLOAD_TOKEN }}
        run: |
          # Pin the build epoch here so the binary and the upload share the exact
          # same timestamp — prevents version mismatch between embedded FW_VERSION
          # and the version string stored in firmware.json on the server.
          BUILD_EPOCH=$(date +%s)
          echo "BUILD_EPOCH=${BUILD_EPOCH}" >> $GITHUB_ENV
          make -j8 BUILD_EPOCH=${BUILD_EPOCH} \
            MQTT_USERNAME="${MQTT_USERNAME}" MQTT_PASSWORD="${MQTT_PASSWORD}" \
            FIRMWARE_UPLOAD_TOKEN="${FIRMWARE_UPLOAD_TOKEN}"

      - name: Upload Firmware to Server
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_SERVER_URL }}
          FIRMWARE_TOKEN: ${{ secrets.FIRMWARE_UPLOAD_TOKEN }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "⚠️  DEPLOY_SERVER_URL secret not configured — skipping upload"
            exit 0
          fi

          # Version format: 1.0.<commit_count>.<build_epoch>
          # The epoch was set in the Build step and exported via $GITHUB_ENV.
          # Every CI build gets a unique version so boards always see a newer
          # candidate — even when the same commit is re-run (workflow re-run).
          COMMIT_COUNT=$(git rev-list --count HEAD)
          FW_VERSION="1.0.${COMMIT_COUNT}.${BUILD_EPOCH}"
          echo "📤 Uploading firmware v${FW_VERSION}..."
          
          HTTP_CODE=$(curl -s -o /tmp/upload_resp.json -w "%{http_code}" \
            -X POST "${DEPLOY_URL}/api/firmware/upload?version=${FW_VERSION}" \
            -H "X-Firmware-Token: ${FIRMWARE_TOKEN}" \
            -F "file=@firmware/build/hesperus-firmware.bin" \
            --connect-timeout 15 \
            --max-time 60)
            
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Firmware uploaded successfully"
            cat /tmp/upload_resp.json
            echo ""
          else
            echo "❌ HTTP $HTTP_CODE — upload failed:"
            cat /tmp/upload_resp.json 2>/dev/null || echo "(no response body)"
            echo "Aborting pipeline to prevent firmware version mismatch..."
            exit 1
          fi

  # ══════════════════════════════════════════════════════════════════════════
  #  Stage 2: Build & Push Docker Images
  # ══════════════════════════════════════════════════════════════════════════
  build-server:
    name: Build Server Image
    runs-on: ubuntu-latest
    needs: [changes, test-server]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.server == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hesperus-server" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}

  build-dashboard:
    name: Build Dashboard Image
    runs-on: ubuntu-latest
    needs: [changes, lint-dashboard]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.dashboard == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hesperus-dashboard" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dashboard image
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}

  # ══════════════════════════════════════════════════════════════════════════
  #  Stage 3: Automated Infrastructure Deployment
  # ══════════════════════════════════════════════════════════════════════════
  deploy-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [changes, build-server, build-dashboard]
    if: |
      always() && 
      (needs.changes.outputs.server == 'true' || needs.changes.outputs.dashboard == 'true') &&
      needs.build-server.result != 'failure' && needs.build-server.result != 'cancelled' &&
      needs.build-dashboard.result != 'failure' && needs.build-dashboard.result != 'cancelled'
    
    steps:
      - name: Execute Remote SSH Deployment
        # DEPLOY_USER's SSH key is a FORCED COMMAND (see infra/vps-provision.sh
        # sshd Match block: ForceCommand /opt/hesperus/deploy.sh). Whatever this
        # step sends as `script` is ignored server-side — the box always runs
        # infra/deploy.sh instead, hard-scoped to /opt/hesperus. This is
        # deliberate: infra-core is a shared host (Forgejo/ntfy/Umami/etc. also
        # live there), so the deploy key must not be able to run arbitrary
        # commands even if the secret ever leaked. Env vars still reach the
        # forced command via SSH's AcceptEnv/SendEnv (independent of ForceCommand).
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: ANTHROPIC_API_KEY,FIRMWARE_UPLOAD_TOKEN,GEMINI_API_KEY,GHCR_TOKEN,MQTT_USERNAME,MQTT_PASSWORD
          script: echo "invoking Hesperus deploy (server enforces infra/deploy.sh via ForceCommand)"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIRMWARE_UPLOAD_TOKEN: ${{ secrets.FIRMWARE_UPLOAD_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
          MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
