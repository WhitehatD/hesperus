# ═══════════════════════════════════════════════════════════════════════════
#  Production Docker Compose — Hesperus (Autonomous IoT Visual Monitoring)
#
#  Deploy with:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
#  Differences from dev compose:
#    - Uses GHCR images instead of local builds
#    - Adds Watchtower for automatic container updates
#    - Mounts firmware volume for OTA binary storage
#    - No hot-reload volume mounts
#    - Dashboard rebound to a loopback port (infra-core's host nginx owns 80/443
#      across multiple tenants; nginx reverse-proxies hesperus.ciocandco.com to
#      this loopback port instead of the container claiming the host's port 80)
# ═══════════════════════════════════════════════════════════════════════════

services:
  # ── Override mosquitto ports ──────────────────────────
  #  1883 (raw MQTT) stays public — the STM32 board connects directly, no
  #  DNS/proxy involved (firmware has no DNS resolver, it dials a raw IP).
  #  9001 (WebSocket) is rebound to loopback — the dashboard's browser code
  #  never hits this port directly; it always goes through nginx's /mqtt
  #  proxy path (see useMQTT.ts fallback), so 9001 doesn't need to be public.
  mosquitto:
    ports: !override
      - "1883:1883"
      - "127.0.0.1:9001:9001"
    healthcheck:
      # Base compose's healthcheck subscribes anonymously — fails immediately
      # once allow_anonymous is false (mosquitto.prod.conf). Override with
      # authenticated creds, read from the persistent env file docker compose
      # already substitutes ${VAR} from (see infra/deploy.sh).
      test: ["CMD-SHELL", "mosquitto_sub -u \"$$MQTT_USERNAME\" -P \"$$MQTT_PASSWORD\" -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
    volumes: !override
      # mosquitto.prod.conf requires auth (allow_anonymous false); passwd is
      # written by infra/rotate-secrets.sh (run manually as root, outside the
      # CI/deploy hot path) — never committed to the repo.
      - ./mosquitto/mosquitto.prod.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  # ── Override server to use GHCR image ────────────────
  server:
    image: ${SERVER_IMAGE:-ghcr.io/whitehatd/hesperus-server:latest}
    build: !reset null
    # `command:` merges as a full array replace, not append — with no
    # override here, prod would otherwise inherit docker-compose.yml's
    # dev-only `--reload --reload-dir app` verbatim (confirmed via
    # `docker compose -f docker-compose.yml -f docker-compose.prod.yml
    # config server` before adding this line). Reset it so prod runs
    # exactly the image's own CMD (server/Dockerfile — no reload, ever).
    command: !reset null
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes: !override
      - server_data:/app/data
      - firmware_data:/app/data/firmware
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - DATABASE_URL=sqlite+aiosqlite:///./data/thesis.db
      - VLLM_BASE_URL=http://host.docker.internal:8001/v1
      - FIRMWARE_DIR=/app/data/firmware
      - FIRMWARE_UPLOAD_TOKEN=${FIRMWARE_UPLOAD_TOKEN:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CLAUDE_SONNET_MODEL=${CLAUDE_SONNET_MODEL:-claude-sonnet-4-6}
      - CLAUDE_HAIKU_MODEL=${CLAUDE_HAIKU_MODEL:-claude-haiku-4-5-20251001}
      - TZ=Europe/Brussels

  # ── Override dashboard to use GHCR image ─────────────
  dashboard:
    image: ${DASHBOARD_IMAGE:-ghcr.io/whitehatd/hesperus-dashboard:latest}
    build: !reset null
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports: !override
      - "127.0.0.1:3002:3000"   # nginx on infra-core reverse-proxies hesperus.ciocandco.com here

  # ── Watchtower — Auto-update containers ──────────────
  #
  #  Polls GHCR every 5 minutes for new images.
  #  When a new image is detected, pulls it and restarts the container.
  #  This is the "git push → auto-deploy" mechanism.
  watchtower:
    image: nickfedor/watchtower:latest    # containrrr/watchtower is EOL; nickfedor fork supports Docker API ≥1.40
    container_name: hesperus-watchtower
    environment:
      - WATCHTOWER_POLL_INTERVAL=300       # Check every 5 minutes
      - WATCHTOWER_CLEANUP=true            # Remove old images
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_LABEL_ENABLE=true       # Only containers with the watchtower.enable label
                                            # (infra-core is a SHARED host — must not touch
                                            # Forgejo/ntfy/Umami/oauth2-proxy containers)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # No docker config mount — ghcr.io/whitehatd/hesperus-{server,dashboard}
      # are public packages, watchtower needs no registry credentials to poll
      # them. (The old mount pointed at a path that didn't exist on the
      # hesperus-deploy user's home dir; docker silently auto-created it as a
      # DIRECTORY instead of a file, which then made every docker-compose
      # invocation print "Error parsing config file: ... is a directory".)
    restart: unless-stopped

volumes:
  firmware_data:
