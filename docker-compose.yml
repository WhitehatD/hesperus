services:
  # ── MQTT Broker ──────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: hesperus-mosquitto
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # WebSocket (for dashboard)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ── FastAPI Server ───────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hesperus-server
    ports:
      - "8000:8000"
    # Local-dev-only hot reload. --reload-dir scopes the file-watcher to just
    # the bind-mounted source (./server/app -> /app/app below) — NOT the
    # server_data volume mounted at /app/data, which holds the SQLite DB and
    # uploads. Without that scope, every capture/schedule/energy-telemetry
    # write is a "file changed" event: uvicorn kills and respawns the worker,
    # tearing down the MQTT connection (and everything else in-process —
    # command queue, board snapshot) on every single write. The prod image
    # (server/Dockerfile) ships with no --reload at all.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "app"]
    # Optional: server/.env is a LOCAL-DEV convenience file and is gitignored
    # (copy server/.env.example to create it). It must stay optional — prod
    # merges this file with docker-compose.prod.yml (see infra/deploy.sh), and
    # on the VPS there is no server/.env at all: prod config comes from
    # .env.prod via ${VAR} substitution in docker-compose.prod.yml. Without
    # `required: false` the prod deploy aborts with "env file not found".
    env_file:
      - path: ./server/.env
        required: false
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - DATABASE_URL=sqlite+aiosqlite:///./data/thesis.db
      - VLLM_BASE_URL=http://host.docker.internal:8001/v1
      - TZ=Europe/Brussels
    volumes:
      - ./server/app:/app/app         # Hot reload in dev
      - server_data:/app/data         # Persistent DB + uploads
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/health'); r.raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── Next.js Dashboard ───────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        - NEXT_PUBLIC_MQTT_WS_URL=${NEXT_PUBLIC_MQTT_WS_URL:-ws://localhost:9001}
    container_name: hesperus-dashboard
    ports:
      - "80:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_MQTT_WS_URL=${NEXT_PUBLIC_MQTT_WS_URL:-ws://localhost:9001}
    depends_on:
      - server
      - mosquitto
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_log:
  server_data:
